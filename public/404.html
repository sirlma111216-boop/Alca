<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>페이지를 찾을 수 없습니다 — 브릭픽</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b18;
        --panel: #0b1226;
        --line: #1e2b52;
        --text: #e8edff;
        --dim: #8ea0c9;
        --accent: #22d3ee;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: Pretendard, 'Noto Sans KR', 'Malgun Gothic', -apple-system,
          BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        line-height: 1.7;
      }
      main {
        width: 100%;
        max-width: 480px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 32px 28px;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.18em;
        color: var(--accent);
        margin: 0 0 8px;
      }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { margin: 0 0 16px; color: var(--dim); font-size: 15px; }
      ul { margin: 0 0 20px; padding-left: 20px; color: var(--dim); font-size: 15px; }
      li { margin-bottom: 6px; }
      code {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        background: #111c3a;
        border-radius: 5px;
        padding: 2px 6px;
        font-size: 13px;
        color: var(--text);
      }
      a.home {
        display: inline-block;
        background: var(--accent);
        color: #06121c;
        font-weight: 700;
        text-decoration: none;
        padding: 11px 20px;
        border-radius: 10px;
      }
      a.home:focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; }
      .bricks { display: flex; gap: 4px; margin-bottom: 20px; }
      .bricks span {
        height: 12px;
        flex: 1;
        border-radius: 2px;
        border-top: 2px solid rgba(255, 255, 255, 0.28);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="bricks" aria-hidden="true">
        <span style="background:#38bdf8"></span>
        <span style="background:#22d3ee"></span>
        <span style="background:#e879f9"></span>
        <span style="background:#fbbf24"></span>
        <span style="background:#cbd5e1"></span>
      </div>
      <p class="code">404</p>
      <h1>이 주소에는 아무것도 없습니다</h1>
      <p>주소를 잘못 입력했거나, 링크가 오래된 것일 수 있습니다.</p>
      <ul>
        <li>게임 화면은 <code>/</code> 입니다.</li>
        <li>수업 앱에 삽입하는 임베드 주소는 <code>/embed/</code> 입니다.</li>
      </ul>
      <a class="home" href="/">게임 화면으로 가기</a>
    </main>
  </body>
</html>
