<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="브릭픽 임베드 화면 — 수업 앱이 iframe 으로 여는 발표자 선정 게임입니다."
    />
    <title>브릭픽 — 임베드</title>
    <style>
      /*
        임베드 페이지 자체의 최소 뼈대.
        게임 화면 스타일(bp-*)은 src/styles/brickpick.css 가 담당한다.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #070b18;
        color: #e8edff;
        font-family:
          'Pretendard Variable', Pretendard, 'Noto Sans KR', 'Malgun Gothic',
          -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        overscroll-behavior: none;
      }

      #root {
        display: block;
        width: 100%;
        height: 100%;
      }

      #bp-noscript {
        display: block;
        padding: 24px;
        font-size: 16px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p id="bp-noscript">
        이 화면은 자바스크립트가 있어야 동작합니다. 브라우저 설정에서 자바스크립트를 켠 뒤
        수업 앱에서 다시 열어 주세요.
      </p>
    </noscript>
    <script type="module" src="/src/embed/main.tsx"></script>
  </body>
</html>
